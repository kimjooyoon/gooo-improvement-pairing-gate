name: v0.1.0 release

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact previously verified main commit to resume a matching draft release
        required: true
        type: string
      post_main_run_id:
        description: Successful post-main CI run that produced target_sha
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: inputs.target_sha != '' && inputs.post_main_run_id != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out the verified main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Set up Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false

      - name: Verify exact target and generate release output
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
          POST_MAIN_RUN_ID: ${{ inputs.post_main_run_id }}
        run: |
          set -euo pipefail
          post_main=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$POST_MAIN_RUN_ID")
          test "$(jq -r '.name' <<<"$post_main")" = "post-main CI"
          test "$(jq -r '.event' <<<"$post_main")" = "push"
          test "$(jq -r '.head_branch' <<<"$post_main")" = "main"
          test "$(jq -r '.head_sha' <<<"$post_main")" = "$TARGET_SHA"
          test "$(jq -r '.conclusion' <<<"$post_main")" = "success"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          output="$RUNNER_TEMP/pairing-output"
          mkdir -p "$output"
          go run ./cmd/gooo-pairing-gate --source . --fixture testdata/canonical-fixtures.json --metacode .gooo/pairing-gate.gooo --output "$output"
          test "$(find "$output" -maxdepth 1 -type f | wc -l | tr -d ' ')" = "5"
          archive="$RUNNER_TEMP/gooo-improvement-pairing-gate-v0.1.0.tar.gz"
          tar -czf "$archive" -C "$output" pairing-manifest.json pairing-events.ndjson comparison-receipt.json decision-receipt.json report.md
          sha256sum "$archive" > "$RUNNER_TEMP/SHA256SUMS"

      - name: Create annotated immutable tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
          TAG: v0.1.0
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          existing_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>/dev/null || true)
          if [[ -n "$existing_ref" ]]; then
            test "$(jq -r '.object.type' <<<"$existing_ref")" = "tag"
            existing_tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r '.object.sha' <<<"$existing_ref")")
            test "$(jq -r '.object.sha' <<<"$existing_tag_object")" = "$TARGET_SHA"
          else
            git tag -a "$TAG" "$TARGET_SHA" -m "gooo improvement pairing gate $TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create draft release
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
          TAG: v0.1.0
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\" and .draft == true) | .id" | head -n 1)
          if [[ -z "$release_id" ]]; then
            gh release create "$TAG" --draft --target "$TARGET_SHA" --title "$TAG" --notes "Exact matched before/after integer pairing gate release."
            release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\" and .draft == true) | .id" | head -n 1)
          fi
          test -n "$release_id"
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")
          test "$(jq -r '.draft' <<<"$draft")" = "true"
          test "$(jq -r '.target_commitish' <<<"$draft")" = "$TARGET_SHA"
          printf '%s\n' "$release_id" > "$RUNNER_TEMP/release-id"

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0
        run: |
          set -euo pipefail
          release_id=$(cat "$RUNNER_TEMP/release-id")
          archive="$RUNNER_TEMP/gooo-improvement-pairing-gate-v0.1.0.tar.gz"
          sums="$RUNNER_TEMP/SHA256SUMS"
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets")
          expected_archive_digest="sha256:$(cut -d' ' -f1 "$sums")"
          expected_sums_digest="sha256:$(sha256sum "$sums" | cut -d' ' -f1)"
          upload_asset() {
            local path="$1"
            local name="$2"
            local content_type="$3"
            gh api --method POST -H "Content-Type: $content_type" "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$name" --input "$path" >/dev/null
          }
          archive_asset=$(jq --arg name "$(basename "$archive")" '[.[] | select(.name == $name)] | if length == 1 then .[0] else empty end' <<<"$assets")
          if [[ -n "$archive_asset" ]]; then
            test "$(jq -r '.size' <<<"$archive_asset")" = "$(stat -c '%s' "$archive")"
            test "$(jq -r '.digest' <<<"$archive_asset")" = "$expected_archive_digest"
          else
            upload_asset "$archive" "$(basename "$archive")" "application/gzip"
          fi
          sums_asset=$(jq --arg name "$(basename "$sums")" '[.[] | select(.name == $name)] | if length == 1 then .[0] else empty end' <<<"$assets")
          if [[ -n "$sums_asset" ]]; then
            test "$(jq -r '.size' <<<"$sums_asset")" = "$(stat -c '%s' "$sums")"
            test "$(jq -r '.digest' <<<"$sums_asset")" = "$expected_sums_digest"
          else
            upload_asset "$sums" "$(basename "$sums")" "text/plain"
          fi

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0
        run: |
          set -euo pipefail
          release_id=$(cat "$RUNNER_TEMP/release-id")
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false >/dev/null

      - name: Verify public tag, immutable release, asset size, and digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.workflow_run.head_sha }}
          TAG: v0.1.0
        run: |
          set -euo pipefail
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          test "$(jq -r '.draft' <<<"$release")" = "false"
          test "$(jq -r '.immutable' <<<"$release")" = "true"

          tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          test "$(jq -r '.object.type' <<<"$tag_ref")" = "tag"
          tag_object_sha=$(jq -r '.object.sha' <<<"$tag_ref")
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha")
          test "$(jq -r '.object.sha' <<<"$tag_object")" = "$TARGET_SHA"

          archive_name=gooo-improvement-pairing-gate-v0.1.0.tar.gz
          local_size=$(stat -c '%s' "$RUNNER_TEMP/$archive_name")
          local_digest=$(cut -d' ' -f1 "$RUNNER_TEMP/SHA256SUMS")
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/$(jq -r '.id' <<<"$release")/assets")
          api_size=$(jq -r --arg name "$archive_name" '.[] | select(.name == $name) | .size' <<<"$assets")
          api_digest=$(jq -r --arg name "$archive_name" '.[] | select(.name == $name) | .digest' <<<"$assets")
          test "$api_size" = "$local_size"
          test "$api_digest" = "sha256:$local_digest"

      - name: Preserve release verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gooo-improvement-pairing-gate-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pairing-output
            ${{ runner.temp }}/SHA256SUMS
            ${{ runner.temp }}/gooo-improvement-pairing-gate-v0.1.0.tar.gz
          if-no-files-found: warn
          retention-days: 30
